# Registry submission source; live registry publication is separate.
# The server supplies its current capability inventory through tools/list.
name: coherence-mcp-server
description: >
  Coherence companion tools for grounded help, ideas and creation. Ten
  public-read/current-chat tools by default; additional network capabilities
  require an explicit advanced profile.
homepage: https://coherencycoin.com
repository: https://github.com/seeker71/Coherence-Network
license: Apache-2.0
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    description: Configure ~/.coherence-network/config.json under mcp. The default companion profile uses public reads. Node 18+ and uv are recommended.
  commandFunction: |-
    () => ({
      command: "npx",
      args: ["-y", "https://github.com/seeker71/Coherence-Network/releases/download/companion-v0.6.0/coherence-mcp-server-0.6.0.tgz"]
    })
