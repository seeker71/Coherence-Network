name: Test

# The API suite is a proof a pull request carries when it touches the compatibility host or the
# kernel it runs on. It runs on the PR, not on every push to main (a merge deploys; the proof
# belongs before it). The web build runs when the web changes. tests/holdout stays out, as locally.
on:
  pull_request:
    paths:
      - "api/**"
      - "form"
      - "Dockerfile.api"
      - "scripts/fkwu_run.sh"
      - ".github/workflows/test.yml"
      - ".github/workflows/hostinger-auto-deploy.yml"
      - "deploy/hostinger/**"
      - "scripts/test_hostinger_deploy_lock.sh"
      - "web/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deployment-ownership:
    name: Deployment ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test_hostinger_deploy_lock.sh

  api:
    name: API suite
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the kernel seed the suite runs recipes on
        run: cd form && cc -O2 -o fkwu runtime/fkwu-uni.c
      - name: Install the API
        run: cd api && pip install -e ".[dev]"
      - name: Commit evidence for the changed surface
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 scripts/validate_commit_evidence.py --base "$BASE_SHA" --head "$HEAD_SHA" --require-changed-evidence
      - name: Spec quality for changed specs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 scripts/validate_spec_quality.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Workflow file references
        run: python3 scripts/validate_workflow_references.py
      - name: API suite
        run: cd api && pytest -q -p no:cacheprovider --ignore=tests/holdout

  web:
    name: Web build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Changed paths
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/web-changed-paths"
            if grep -qE '^web/' "$RUNNER_TEMP/web-changed-paths"; then
              echo "web=true" >> "$GITHUB_OUTPUT"
            else
              echo "web=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Set up Node.js
        if: steps.changed.outputs.web == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build and test the web
        if: steps.changed.outputs.web == 'true'
        run: |
          cd web && npm ci --allow-git=none && npm run build && npm run test
