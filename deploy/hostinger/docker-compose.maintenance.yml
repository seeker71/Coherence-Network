services:
  api:
    # `docker compose run` does not accept Docker's `--cpus`/`--memory`
    # flags. Keep deployment grounding outside the serving container and apply
    # its hard resource boundary through the service model Compose supports.
    cpus: 1.0
    mem_limit: 2g
    # The production api service carries public router labels. A one-off shell
    # sidecar must never inherit public discovery and enter Traefik's backend
    # pool while it performs maintenance instead of serving HTTP.
    labels:
      traefik.enable: "false"
